name: Build APK

# 两种触发：
# 1. PR 合并到 main 后触发（PR 合并本质是对 main 的一次 push）。
#    只构建并上传 workflow artifact，供发版前验证。
# 2. 在 GitHub 上发布 Release（published）时触发。
#    构建后自动把 APK 以 MD-Opener-<tag>.apk 与 MD-Opener-latest.apk 两个名字
#    附到该 Release——发版时只需写好说明点发布，无需手动上传 APK。
#    官网直链指向 releases/latest/download/MD-Opener-latest.apk，始终落到最新
#    Release；旧 Release 里的同名资产无需删除，仅作历史存档。
on:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release 事件时上传资产需要写权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mdopener-release.keystore"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/mdopener-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-opener-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd app/build/outputs/apk/release
          cp app-release.apk "MD-Opener-${TAG}.apk"
          cp app-release.apk MD-Opener-latest.apk
          gh release upload "$TAG" "MD-Opener-${TAG}.apk" MD-Opener-latest.apk --clobber
