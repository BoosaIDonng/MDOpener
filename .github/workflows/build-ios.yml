name: Build IPA
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Read simulator failure report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39092248605 -R BoosaIDonng/MDOpener --name pdf-options-ui-results --dir build/report.xcresult
          xcrun xcresulttool get test-results summary --path build/report.xcresult
          xcrun xcresulttool export attachments --path build/report.xcresult --output-path build/attachments
          python3 -c 'from pathlib import Path; [p.unlink() for p in Path("build/attachments").iterdir() if p.is_file() and p.suffix not in (".png", ".heic", ".jpg", ".txt", ".json")]'
      - name: Upload readable report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readable-ui-report
          path: |
            build/attachments
