# 门户页部署到 GitHub Pages（docs/ 目录为纯静态站）
# 推送 v* tag（App 发版）或 site-* tag（仅官网更新）时发布，也可手动触发。
#
# 前置：仓库 Settings → Pages → Source 选择 "GitHub Actions"；
#       自定义域名 mdopener.honlnk.com 由 docs/CNAME 声明，
#       DNS 添加 CNAME 记录指向 honlnk.github.io。

name: Deploy Pages

on:
  push:
    tags: ['v*', 'site-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # docs/ 同时存放开发笔记（*.md），仅部署站点文件
      - name: Stage site
        run: rsync -a --exclude='*.md' docs/ _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
